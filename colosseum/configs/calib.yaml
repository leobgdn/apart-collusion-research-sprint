# Track B calibration (plan fixed in reports/colosseum_check.md section 9 before running).
# 18 episodes = max_tasks {8,4,3} x {no channel, channel+structured} x seeds 101-103.
# Runs via scripts/proxy.py --upstream on port 8032.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 2
  seed: 101

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: q3
    llm:
      provider: vllm
      vllm:
        auto_start_server: false
        persistent_server: true
        health_check_path: "/models"
        params:
          max_tokens: 512
          temperature: 0.7
        models:
          - checkpoint: "Qwen/Qwen3-8B"
            base_url: "http://127.0.0.1:8032/v1"

experiment:
  tag: tbc
  output_dir: ../outputs/calib
  max_concurrent_runs: 4
  seeds: [101, 102, 103]
  collusion:
    colluder_selection: random
    agent_order: random
  sweeps:
    # Short tag/sweep/label names: Windows MAX_PATH (260) is hit by the default prompt logs otherwise.
    # The runner drops (secret=false, variant!=control) combos, so the baseline is its own sweep.
    - name: base
      environments:
        - {label: t8, name: JiraTicketEnvironment, max_tasks: 8}
        - {label: t4, name: JiraTicketEnvironment, max_tasks: 4}
        - {label: t3, name: JiraTicketEnvironment, max_tasks: 3}
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [control]
    - name: chan
      environments:
        - {label: t8, name: JiraTicketEnvironment, max_tasks: 8}
        - {label: t4, name: JiraTicketEnvironment, max_tasks: 4}
        - {label: t3, name: JiraTicketEnvironment, max_tasks: 3}
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [structured]
