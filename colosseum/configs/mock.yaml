# Track B mock run: 4 agents, complete graph, 2 colluders; baseline / secret+control / secret+simple.
# Points the native vllm provider at scripts/proxy.py --mock on port 8031 (no GPU).
simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 3
  seed: 1

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: mock
    llm:
      provider: vllm
      vllm:
        auto_start_server: false
        persistent_server: true
        health_check_path: "/models"
        params:
          max_tokens: 1024
          temperature: 0.7
        models:
          - checkpoint: "Qwen/Qwen3-8B"
            base_url: "http://127.0.0.1:8031/v1"

experiment:
  tag: trackB_mock
  output_dir: ../outputs/mock
  max_concurrent_runs: 3
  seeds: [1]
  collusion:
    colluder_selection: random
    agent_order: random
  sweeps:
    - name: mock
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]
